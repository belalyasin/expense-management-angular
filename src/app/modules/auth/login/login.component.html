<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <span class="h2"><b>Expense</b> Manager</span>
    </div>
    <div class="card-body">
      <p class="login-box-msg">Sign in to track your expenses</p>

      <div class="alert alert-warning" role="alert" *ngIf="notice === 'expired'">
        Your session expired. Please sign in again.
      </div>
      <div class="alert alert-success" role="alert" *ngIf="notice === 'registered'">
        Account created. You can sign in now.
      </div>
      <div class="alert alert-danger" role="alert" *ngIf="error">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="input-group mb-3">
          <input
            type="email"
            class="form-control"
            placeholder="Email"
            aria-label="Email"
            autocomplete="email"
            formControlName="email"
            [class.is-invalid]="showError('email')"
          />
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
          </div>
          <span class="invalid-feedback">Enter a valid email address.</span>
        </div>
        <div class="input-group mb-3">
          <input
            type="password"
            class="form-control"
            placeholder="Password"
            aria-label="Password"
            autocomplete="current-password"
            formControlName="password"
            [class.is-invalid]="showError('password')"
          />
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-lock"></span></div>
          </div>
          <span class="invalid-feedback">Enter your password.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting">
          {{ submitting ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      <p class="mt-3 mb-0 text-center">
        <a routerLink="/register">Create an account</a>
      </p>
    </div>
  </div>
</div>
