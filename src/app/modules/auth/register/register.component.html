<div class="register-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <span class="h2"><b>Expense</b> Manager</span>
    </div>
    <div class="card-body">
      <p class="login-box-msg">Create an account</p>

      <div class="alert alert-danger" role="alert" *ngIf="error">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-row">
          <div class="form-group col-sm-6">
            <input
              type="text"
              class="form-control"
              placeholder="First name"
              aria-label="First name"
              autocomplete="given-name"
              formControlName="firstname"
              [class.is-invalid]="showError('firstname')"
            />
            <span class="invalid-feedback">Enter your first name.</span>
          </div>
          <div class="form-group col-sm-6">
            <input
              type="text"
              class="form-control"
              placeholder="Last name"
              aria-label="Last name"
              autocomplete="family-name"
              formControlName="lastname"
              [class.is-invalid]="showError('lastname')"
            />
            <span class="invalid-feedback">Enter your last name.</span>
          </div>
        </div>
        <div class="form-group">
          <input
            type="text"
            class="form-control"
            placeholder="Username"
            aria-label="Username"
            autocomplete="username"
            formControlName="username"
            [class.is-invalid]="showError('username')"
          />
          <span class="invalid-feedback">Choose a username.</span>
        </div>
        <div class="form-group">
          <input
            type="email"
            class="form-control"
            placeholder="Email"
            aria-label="Email"
            autocomplete="email"
            formControlName="email"
            [class.is-invalid]="showError('email')"
          />
          <span class="invalid-feedback">Enter a valid email address.</span>
        </div>
        <div class="form-group">
          <input
            type="password"
            class="form-control"
            placeholder="Password (8 characters or more)"
            aria-label="Password"
            autocomplete="new-password"
            formControlName="password"
            [class.is-invalid]="showError('password')"
          />
          <span class="invalid-feedback">Use at least 8 characters.</span>
        </div>
        <div class="form-group">
          <input
            type="password"
            class="form-control"
            placeholder="Retype password"
            aria-label="Retype password"
            autocomplete="new-password"
            formControlName="confirm"
            [class.is-invalid]="showError('confirm') || passwordsDiffer"
          />
          <span class="invalid-feedback">The two passwords do not match.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting">
          {{ submitting ? 'Creating account…' : 'Register' }}
        </button>
      </form>

      <p class="mt-3 mb-0 text-center">
        <a routerLink="/login">I already have an account</a>
      </p>
    </div>
  </div>
</div>
