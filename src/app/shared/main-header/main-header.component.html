<nav class="main-header navbar navbar-expand navbar-dark">
  <ul class="navbar-nav">
    <li class="nav-item">
      <button type="button" class="nav-link btn btn-link" data-widget="pushmenu" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
    </li>
  </ul>

  <ul class="navbar-nav ml-auto align-items-center">
    <li class="nav-item d-none d-sm-block" *ngIf="auth.user$ | async as user">
      <a class="nav-link" routerLink="/profile">
        <i class="far fa-user mr-1"></i>{{ user.firstname }} {{ user.lastname }}
      </a>
    </li>
    <li class="nav-item">
      <button type="button" class="nav-link btn btn-link" (click)="logout()" [disabled]="loggingOut">
        <i class="fas fa-sign-out-alt mr-1"></i>Log out
      </button>
    </li>
  </ul>
</nav>
