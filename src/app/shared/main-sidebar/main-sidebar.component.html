<aside class="main-sidebar sidebar-dark-primary elevation-4">
  <a routerLink="/dashboard" class="brand-link" (click)="closeOnMobile()">
    <i class="fas fa-wallet brand-image mt-2 ml-3"></i>
    <span class="brand-text font-weight-light">Expense Manager</span>
  </a>

  <div class="sidebar">
    <nav class="mt-2" aria-label="Main">
      <ul class="nav nav-pills nav-sidebar flex-column" role="menu">
        <li class="nav-item" *ngFor="let item of items">
          <a [routerLink]="item.link" routerLinkActive="active" class="nav-link" (click)="closeOnMobile()">
            <i class="nav-icon" [ngClass]="item.icon"></i>
            <p>{{ item.label }}</p>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</aside>
